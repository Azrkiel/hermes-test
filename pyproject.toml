[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agent-bridge"
version = "0.1.0"
description = "Durable MCP worktree bridge to official coding-agent CLIs"
requires-python = ">=3.11"
dependencies = ["mcp>=1.20,<2", "psutil>=6,<8", "pywin32>=306; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[tool.setuptools]
py-modules = ["bridge_core", "bridge_runner", "bridge_review", "bridge_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
